services:
  postgres:
    image: postgres:latest
    container_name: werewolf-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: werewolf
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: werewolf-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

  # Broker MQTT giai đoạn 2 (PLAN-REALTIME.md mục 3.2) — chỉ thật sự được dùng khi
  # realtime.module.ts đang bind EmqxMqttBrokerAdapter. Cấu hình auth/ACL config-as-code ở
  # emqx/emqx.conf, không cấu hình tay qua dashboard.
  emqx:
    image: emqx/emqx:5.8
    container_name: werewolf-emqx
    ports:
      - '1883:1883' # MQTT TCP — mobile/native
      - '8083:8083' # MQTT over WebSocket — browser
      - '18083:18083' # Dashboard quản trị EMQX (chỉ để xem log/debug, không dùng để cấu hình)
    # KHÔNG truyền secret qua `environment` — trường `headers`/`body` của khối `authorization`
    # (webhook) trong emqx.conf chỉ nhận đúng 1 bộ placeholder cố định của EMQX
    # (username/clientid/password/...), không thay được bằng biến môi trường tuỳ ý (đã xác nhận
    # qua log thật: "auth_template_invalid ... disallowed"). Secret phải nằm thẳng trong
    # emqx.conf/mqtt-internal-users.csv (2 file gitignore, có bản .example — cùng convention với
    # .env/.env.example).
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/mqtt-internal-users.csv:/opt/emqx/etc/mqtt-internal-users.csv:ro
      - emqx_data:/opt/emqx/data

volumes:
  postgres_data:
  emqx_data:
